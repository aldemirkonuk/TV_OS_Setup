plugins {
    id 'com.android.application'
}

android {
    namespace 'com.maison.launcher'
    compileSdk 34

    defaultConfig {
        applicationId "com.maison.launcher"
        minSdk 22          // Mi TV Stick (Android TV 9) and every Fire TV still in use
        targetSdk 30
        versionCode 1
        versionName "0.1"
    }

    buildTypes {
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
